<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Contato Responsivo"">
    <meta name="keywords" content="Contato - Responsivo">
    <meta name="author" content="Guilherme Domingues">
    <meta name="robots" content="Index, follow">
    <title>Contato - Responsivo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>
<body>
  <div class="container">
    <div class="content">
      <div class="left-side">
        <div class="address details">
          <i class="fas fa-map-marker-alt"></i>
          <div class="topic">Endereço</div>
          <div class="text-one">Exemplo, Nº123</div>
        </div>
        <div class="phone details">
          <i class="fas fa-phone-alt"></i>
          <div class="topic">Telefone</div>
          <div class="text-one">(00) 00000-0000</div>
          <div class="text-two">(00) 00000-0000</div>
        </div>
        <div class="email details">
          <i class="fas fa-envelope"></i>
          <div class="topic">Email</div>
          <div class="text-one">exemplo@gmail.com</div>
          <div class="text-two">exemplo2@gmail.com</div>
        </div>
      </div>
      <div class="right-side">
        <div class="topic-text">Envie-nos uma mensagem</div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. </p>
      <form action="#">
        <div class="input-box">
          <input type="text" placeholder="Digite seu nome">
        </div>
        <div class="input-box">
          <input type="text" placeholder="Digite seu email">
        </div>
        <div class="input-box message-box">
          <input type="text" placeholder="Digite sua mensagem">
        </div>
        <div class="button">
          <input type="button" value="Enviar" >
        </div>
      </form>
    </div>
    </div>
  </div>
</body>
</html>
